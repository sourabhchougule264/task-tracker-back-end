name: CICD

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: checkout sourace
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Project
        run: mvn clean install
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar -Dsonar.projectKey=sourabhchougule264_task-tracker-back-end -Dsonar.host.url=https://sonarcloud.io -Dsonar.token="$SONAR_TOKEN" -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
      - name: Log in to Docker Hub
        env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
      - name: Build Docker Image
        env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker build -t "$DOCKER_USERNAME"/tasktrackerapp:latest .
      - name: Publish Docker Image to Docker Hub
        env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker push "$DOCKER_USERNAME"/tasktrackerapp:latest

  deploy:
    needs: build
    runs-on: [aws-ec-task-tracker]
    steps:
      - name: Pull Docker Image from Docker Hub
        env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker pull "$DOCKER_USERNAME"/tasktrackerapp:latest
      - name: Run Docker Container
        env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker stop tasktrackerapp || true
          docker rm tasktrackerapp || true
          docker run -d --name tasktrackerapp -p 8080:8080 "$DOCKER_USERNAME"/tasktrackerapp:latest
