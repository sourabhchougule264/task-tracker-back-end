name: Backend CICD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific Commit SHA to deploy (Leave blank to use latest master)'
        required: false
        default: ''

env:
  TARGET_COMMIT: ${{ github.event.inputs.commit_sha || github.sha }}

jobs:
  build:
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: ${{ env.TARGET_COMMIT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build Project
        run: mvn clean install -DskipTests
        continue-on-error: false

      - name: Run Tests with Coverage
        run: mvn test jacoco:report

      - name: Upload Coverage to SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=sourabhchougule264_task-tracker-back-end \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"

      - name: Build Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker build -t "$DOCKER_USERNAME"/tasktrackerapp:${{ env.TARGET_COMMIT }} .

      - name: Publish Docker Image to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker push "$DOCKER_USERNAME"/tasktrackerapp:${{ env.TARGET_COMMIT }}

  deploy:
    needs: build
    runs-on: [ aws-ec-task-tracker ]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: ${{ env.TARGET_COMMIT }}

      - name: Pull Docker Image from Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker pull "$DOCKER_USERNAME"/tasktrackerapp:${{ env.TARGET_COMMIT }}

      - name: Deploy via Docker Compose
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ env.TARGET_COMMIT }}
          AWS_REGION: ap-south-1
        run: |
          echo "Fetching configuration from AWS SSM Parameter Store..."
          
          APP_AWS_ACCESS_KEY_ID=$(aws ssm get-parameter --name "/tasktracker/dev/aws_accesskeyid" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          APP_AWS_SECRET_ACCESS_KEY=$(aws ssm get-parameter --name "/tasktracker/dev/aws_secretkey" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          APP_COGNITO_CLIENT=$(aws ssm get-parameter --name "/tasktracker/dev/cognito_clientid" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          APP_COGNITO_SECRET=$(aws ssm get-parameter --name "/tasktracker/dev/cognito_secret" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          APP_POSTGRES_PWD=$(aws ssm get-parameter --name "/tasktracker/dev/postgres_password" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          
          MAIL_HOST=$(aws ssm get-parameter --name "/tasktracker/dev/mail_host" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "smtp.gmail.com")
          MAIL_PORT=$(aws ssm get-parameter --name "/tasktracker/dev/mail_port" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "587")
          MAIL_USERNAME=$(aws ssm get-parameter --name "/tasktracker/dev/mail_username" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          MAIL_PASSWORD=$(aws ssm get-parameter --name "/tasktracker/dev/mail_password" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          MAIL_FROM=$(aws ssm get-parameter --name "/tasktracker/dev/mail_from" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          
          EC2_PRIVATE_IP=$(aws ec2 describe-instances \
            --instance-ids "$(ec2-metadata --instance-id | cut -d ' ' -f 2)" \
            --region "$AWS_REGION" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' \
            --output text)
          
          echo "EC2 Private IP: $EC2_PRIVATE_IP"
          cd deploy/
          
          cat <<EOF > .env
          AWS_ACCESS_KEY_ID=$APP_AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$APP_AWS_SECRET_ACCESS_KEY
          COGNITO_CLIENT_ID=$APP_COGNITO_CLIENT
          COGNITO_SECRET=$APP_COGNITO_SECRET
          POSTGRES_DB_PASSWORD=$APP_POSTGRES_PWD
          DOCKER_USERNAME=$DOCKER_USERNAME
          IMAGE_TAG=$IMAGE_TAG
          MAIL_HOST=$MAIL_HOST
          MAIL_PORT=$MAIL_PORT
          MAIL_USERNAME=$MAIL_USERNAME
          MAIL_PASSWORD=$MAIL_PASSWORD
          MAIL_FROM=$MAIL_FROM
          KAFKA_EC2_PRIVATE_IP=$EC2_PRIVATE_IP
          EOF
          
          if ! command -v docker-compose &> /dev/null; then
             sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
             sudo chmod +x /usr/local/bin/docker-compose
          fi
          
          docker stop tasktrackerapp || true
          docker rm tasktrackerapp || true
          
          docker-compose pull
          docker-compose up -d
          rm .env
          
          bash /home/ubuntu/start_tunnel.sh

      - name: Health Check
        run: |
          sleep 30
          if docker exec tasktrackerapp curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
            echo "✅ Application is healthy"
          else
            echo "❌ Application health check failed"
            docker logs tasktrackerapp | tail -50
            exit 1
          fi

      - name: Verify Topic Creation
        run: |
          docker exec kafka kafka-topics --list --bootstrap-server localhost:9092 | grep -q "task.assigned" && echo "✅ Task assigned topic exists" || echo "⚠️ Topic may not be created yet"

      - name: Notify Deployment Success
        if: success()
        run: |
          echo "✅ Deployment successful for commit: ${{ env.TARGET_COMMIT }}"

      - name: Notify Deployment Failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          exit 1