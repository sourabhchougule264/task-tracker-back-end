name: CICD

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [ ubuntu-latest ]
    steps:
      - name: checkout sourace
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Project
        run: mvn clean install
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar -Dsonar.projectKey=sourabhchougule264_task-tracker-back-end -Dsonar.host.url=https://sonarcloud.io -Dsonar.token="$SONAR_TOKEN" -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
      - name: Build Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker build -t "$DOCKER_USERNAME"/tasktrackerapp:${{ github.sha }} .
      - name: Publish Docker Image to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker push "$DOCKER_USERNAME"/tasktrackerapp:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [ aws-ec-task-tracker ]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Pull Docker Image from Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker pull "$DOCKER_USERNAME"/tasktrackerapp:${{ github.sha }}
      - name: Deploy via Docker Compose
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ap-south-1
        run: |
          echo "Fetching configuration from AWS SSM Parameter Store..."
          # By using 'export', we make these variables available to Docker Compose file
          export AWS_ACCESS_KEY_ID=$(aws ssm get-parameter --name "/tasktracker/dev/aws_accesskeyid" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          export AWS_SECRET_ACCESS_KEY=$(aws ssm get-parameter --name "/tasktracker/dev/aws_secretkey" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          export COGNITO_CLIENT_ID=$(aws ssm get-parameter --name "/tasktracker/dev/cognito_clientid" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          export COGNITO_SECRET=$(aws ssm get-parameter --name "/tasktracker/dev/cognito_secret" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          export POSTGRES_DB_PASSWORD=$(aws ssm get-parameter --name "/tasktracker/dev/postgres_password" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)
          
          echo "Navigating to deployment directory..."
          cd deploy/
          
          echo "Starting the stack with Docker Compose..."
          # This replaces the need for manual 'docker stop' and 'docker run'
          # Docker Compose handles stopping the old container and starting the new one gracefully
          docker compose up -d